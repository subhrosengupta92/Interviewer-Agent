<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dashboard · FirstRound</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400..800&display=swap">
<link rel="stylesheet" href="/chat.css">
<link rel="stylesheet" href="/dashboard.css">
</head>
<body class="dash">
<header class="dash-top">
  <a class="brand" href="/" aria-label="FirstRound home"><span class="logo" data-logo="lime"></span><div><b>First</b><span>Round</span></div></a>
  <nav class="modes" aria-label="Screens">
    <a href="/recruit" id="mode-recruit">Hiring team</a>
    <a href="/chat?invite=northwind-sde2" id="mode-invite">Invited candidate</a>
    <a href="/dashboard" id="mode-dash" class="on">Dashboard</a>
  </nav>
</header>

<main class="desk" id="desk">
  <div class="desk-bar"><i></i><i></i><i></i><span>FirstRound · Interview transcripts</span></div>
  <div class="desk-body">
    <aside class="side" aria-label="Roles and interviews">
      <input type="search" id="find" placeholder="Find a candidate" aria-label="Find a candidate">
      <div id="roles" class="roles"><p class="wait"><span class="spin"></span>Loading interviews…</p></div>
    </aside>

    <section class="talk" aria-labelledby="talk-h">
      <header>
        <h1 id="talk-h">Ask the transcripts</h1>
        <p id="scope">Select interviews on the left, then ask anything across them.</p>
        <div class="picked" id="picked"></div>
      </header>
      <div class="thread" id="thread" role="log" aria-live="polite">
        <div class="matrix" id="matrix"></div>
      </div>
      <div class="ideas" id="ideas"></div>
      <form id="ask-form" autocomplete="off">
        <input id="q" type="text" placeholder="Who handled the hardest follow-up best?" aria-label="Ask a question across the selected transcripts" enterkeyhint="send">
        <button type="submit" id="ask-send" aria-label="Ask"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3 10l12 2-12 2z"/></svg></button>
      </form>
    </section>

    <aside class="reader" id="reader" aria-label="Transcript" hidden>
      <header>
        <div><h2 id="r-name"></h2><p id="r-meta"></p></div>
        <button type="button" id="r-close" aria-label="Close the transcript">✕</button>
      </header>
      <p class="r-sum" id="r-sum"></p>
      <div class="turns" id="r-turns"></div>
    </aside>
  </div>
</main>
<script type="module" src="/assets/dashboard.js"></script>
</body>
</html>
