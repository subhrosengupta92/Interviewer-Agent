<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>FirstRound for hiring teams</title>
<link rel="stylesheet" href="/chat.css">
</head>
<body>
<div class="stage">
  <div class="topbar">
    <div class="brand"><span class="logo" data-logo="lime"></span><div><b>First</b><span>Round</span></div></div>
    <nav class="modes" aria-label="Ways to join">
      <a href="/chat" id="mode-self">Self discovery</a>
      <a href="/chat?invite=northwind-sde2" id="mode-invite">Company invite</a>
      <a href="/recruit" id="mode-recruit">Recruiter</a>
    </nav>
  </div>

  <div class="phone-wrap">
    <div class="phone">
      <div class="island"></div>
      <div class="screen">
        <div class="status"><span id="clock">9:41</span><span class="sig"><i style="height:5px"></i><i style="height:7px"></i><i style="height:9px"></i><i style="height:11px"></i><span class="batt"><i></i></span></span></div>
        <header class="chat-head">
          <span class="back" aria-hidden="true">‹</span>
          <span class="avatar" data-logo="navy"></span>
          <div class="who">
            <div class="n">FirstRound <svg viewBox="0 0 24 24" aria-label="Verified"><path fill="#c8f04a" d="m12 1.5 2.6 2.1 3.3-.2 1 3.2 2.8 1.8-1.2 3.1 1.2 3.1-2.8 1.8-1 3.2-3.3-.2L12 21.5l-2.6-2.1-3.3.2-1-3.2-2.8-1.8 1.2-3.1-1.2-3.1 2.8-1.8 1-3.2 3.3.2z"/><path d="m8 11.8 2.7 2.7L16 9.2" fill="none" stroke="#101828" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div class="s" id="presence" aria-live="polite">online</div>
          </div>
          <div class="head-icons" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.900.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.900.3 1.800.6 2.800.7a2 2 0 0 1 1.7 2z"/></svg>
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
          </div>
        </header>

        <div class="msgs" id="msgs" role="log" aria-live="polite"></div>

        <form class="composer" id="composer" autocomplete="off">
          <div class="field" id="field">
            <input id="text" type="text" placeholder="Message" aria-label="Message" enterkeyhint="send">
            <button type="button" class="attach" id="attach" aria-label="Attach a job description"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11.6-8.9 8.9a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.3-8.3"/></svg></button>
          </div>
          <div class="recbar" id="recbar" hidden><span class="dot"></span><span class="t" id="rectime">0:00</span><span class="hint">Recording… tap send when done</span><button type="button" id="reccancel">Cancel</button></div>
          <button type="submit" class="send" id="send" aria-label="Record a voice note"></button>
          <input type="file" id="cvfile" accept="application/pdf,.pdf,.txt" hidden>
        </form>

        <div class="signin" id="signin">
          <span class="logo big" data-logo="lime"></span>
          <h1>FirstRound<br><span>for hiring teams</span></h1>
          <p>Meet candidates who have already done their first round.</p>
          <label for="rname">Your name</label><input id="rname" type="text" value="Ananya Rao" autocomplete="name">
          <label for="rco">Company</label><input id="rco" type="text" value="Northwind Pay" autocomplete="organization">
          <button type="button" id="signin-go">Continue</button>
        </div>

        <div class="group" id="group" hidden>
          <header class="chat-head">
            <button type="button" class="back" id="group-back" aria-label="Back to FirstRound">‹</button>
            <span class="avatar grp" id="group-avatar"></span>
            <div class="who"><div class="n" id="group-name">Group</div><div class="s" id="group-members"></div></div>
          </header>
          <div class="msgs" id="group-msgs"></div>
          <div class="composer"><div class="field"><input type="text" id="group-text" placeholder="Message" aria-label="Message the group"></div><button type="button" class="send" id="group-send" aria-label="Send"></button></div>
        </div>
      </div>
    </div>
  </div>

  <div class="foot"><button type="button" id="reset">Start over</button></div>
</div>
<script type="module" src="/assets/recruit.js"></script>
</body>
</html>
